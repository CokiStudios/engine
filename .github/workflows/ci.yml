name: Looping Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify (macOS / Linux)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++17 Looping Engine
        run: |
          make -C cpp

      - name: Run Looping Native Test Suite (71/71 — v1.1 / Arch 3.0A)
        run: |
          ./bin/looping test
          ./bin/looping --version
          ./bin/looping --omega --version
          ./bin/looping --alpha --version

      - name: Verify smiledev Package Manager CLI (v1.1 & Alpha! 1.1A)
        run: |
          ./bin/smiledev version
          ./bin/smiledev version --alpha
          ./bin/smiledev help
